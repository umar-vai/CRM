name: tests

on:
  push:
    branches:
      - main
      - release/ux-foundation-from-live
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: novaflow_testing
          POSTGRES_USER: novaflow
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: ${{ matrix.database == 'sqlite' && ':memory:' || 'novaflow_testing' }}
      DB_USERNAME: novaflow
      DB_PASSWORD: ci-only-password

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Application
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          cp .env.example .env
          php artisan key:generate
          npm run build

      - name: Run CI Checks
        run: composer ci:check
