name: Format UX branch (temporary)

on:
  push:
    branches:
      - feature/ux-foundation-workspace

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'umar-vai/CRM'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Apply repository formatter to UX files only
        run: npx vp check --fix resources/js/components/app-sidebar.tsx resources/js/components/workspace-ui.tsx resources/js/pages/dashboard.tsx resources/js/pages/workspaces/show.tsx
      - name: Commit formatted files if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/components/app-sidebar.tsx resources/js/components/workspace-ui.tsx resources/js/pages/dashboard.tsx resources/js/pages/workspaces/show.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(ui): apply repository formatter to UX foundation"
            git push origin HEAD:feature/ux-foundation-workspace
          fi
